name: build-windows-exe

# Builds a standalone anko-color.exe (no Python needed on the user's PC).
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0 to
# also attach the .exe to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install hidapi pyinstaller
      - name: Build anko-color.exe
        run: >
          pyinstaller --onefile --name anko-color
          --add-data "anko-mouse.py;."
          --add-data "anko-1440-profile.hex;."
          anko-color.py
      - name: Smoke test (no mouse needed)
        run: dist\anko-color.exe --dry-run red
      - uses: actions/upload-artifact@v4
        with:
          name: anko-color-windows
          path: dist/anko-color.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anko-color.exe
