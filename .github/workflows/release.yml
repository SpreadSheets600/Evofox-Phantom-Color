name: build-and-release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 
            sep: ":"
            built: efp-color
            asset: efp-color-linux-x86_64
          - os: windows-latest
            sep: ";"
            built: efp-color.exe
            asset: efp-color-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Install build dependencies
        run: pip install hidapi pyinstaller
      - name: Build ${{ matrix.built }}
        run: >
          pyinstaller --onefile --name efp-color
          --add-data "efp-1440-profile.hex${{ matrix.sep }}."
          efp-color.py
      - name: Smoke test (no mouse needed)
        run: ./dist/${{ matrix.built }} --dry-run red
      - name: Name the binary
        run: mv "dist/${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum efp-color-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
